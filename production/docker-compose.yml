    deploy:
      resources:
        limits:
          cpus: "0.0"
          memory: "0"
    networks:
      - backend-network
    depends_on:
      - es_gateway

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"
    environment:
      - ADMIN_USERNAME=your-username
      - ADMIN_PASSWORD=your-password

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      es_payments:
        condition: service_started
      es_gateway:
        condition: service_started
    networks:
      - backend-network

networks:
  backend-network:
    driver: "bridge"

volumes:
  portainer_data:
