syntax = "proto3";

option go_package = "github.com/Eskiwi-Organization/infra/commons/api";

package api;

import "google/protobuf/timestamp.proto";


message PublicUser {
    string id = 1;            // Use string or bytes for ObjectID
    string display_name=2;
    string username = 4;
    string avatar_uri = 5;
    string banner_uri = 6;
    string description = 7;
    google.protobuf.Timestamp created_at = 8;    // You can use timestamp type for actual use
    int64 followers = 9;
    int64 following = 10;
    int64 subscribers= 11;
  }

message Notification {
  string id=7;
  PublicUser user = 1;
  Post post = 2;
  Comment comment= 3;
  google.protobuf.Timestamp created_at = 8;       // Use timestamp type if needed
  string destination_user_id = 4; // Use string or bytes for ObjectID
  bool is_read = 5;
  string type = 6;             // "Follow", "Like", "Comment", "Message", "newPost"
  bool subscribed=9;
}

message GetLatestNotificationsRequest {
    string userID = 1;
    int32 page = 2;
}

message GetLatestNotificationsResponse {
    repeated Notification notifications = 1;
}

message NotificationsSettings {
    bool pop_Up = 1;
    bool unread_messages = 2;
    bool new_Post = 3;
    bool new_About_Eskiwi = 4;
    bool new_Sub = 5;
    bool new_Comment = 6;
    bool new_Like = 7;
    string user_id= 8;
  }



service NotificationService {
    rpc GetLatestNotifications(GetLatestNotificationsRequest) returns (GetLatestNotificationsResponse);
    
}

