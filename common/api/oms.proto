    rpc SendUserCode(SendUserCodeRequest) returns (SendUserCodeResponse);
    rpc ValidateUser(ValidateUserRequest) returns(ValidateUserResponse);
    rpc RegisterUser(RegisterUserRequest) returns(RegisterUserResponse);
    rpc ChangePassword(ChangePasswordRequest) returns(ChangePasswordResponse);
    rpc GetUser(GetUserRequest) returns(User);
    rpc GetUserByID(GetUserRequest) returns(User);
    rpc UpdateAvatar(UpdateAvatarRequest) returns(UpdateAvatarResponse);
    rpc UpdateBanner(UpdateBannerRequest) returns(UpdateBannerResponse);
    rpc FollowUser(FollowUserRequest) returns(FollowUserResponse);
    rpc UnFollowUser(FollowUserRequest) returns(FollowUserResponse);
    rpc GetUserFollow(GetUserFollowRequest) returns(GetUserFollowResponse);
    rpc UpdateDescription(UpdateDescriptionRequest) returns(UpdateDescriptionResponse);
    rpc UpdateUsername(UpdateUsernameRequest) returns(UpdateUsernameResponse);
    rpc AddExpoToken(AddExpoTokenRequest) returns(AddExpoTokenResponse);
    rpc DeleteExpoToken(AddExpoTokenRequest) returns(AddExpoTokenResponse);
    rpc UpdateNotificationsSettings(NotificationsSettings) returns (UpdateNotificationsSettingsResponse);
    rpc GetUserNotificationSettings(GetUserNotificationSettingsRequest) returns (NotificationsSettings);
    rpc SearchCreators(SearchCreatorsRequest) returns (SearchCreatorsResponse);
    rpc GetTopCreator(GetTopCreatorRequest) returns (GetTopCreatorResponse);
    rpc CreateChatsSettings(CreateChatsSettingsRequest) returns (CreateChatsSettingsResponse);
    rpc GetChatSettings(GetChatSettingsRequest) returns (ChatsSettings);
    rpc GetTransactions(GetTransactionsRequest) returns (TransactionsResponse);
    rpc CreateSubscriptionTier(SubscriptionTiers) returns (CreateSubscriptionTierResponse);
    rpc UpdateSubscriptionTier(SubscriptionTiers) returns (UpdateSubscriptionTierResponse);
    rpc GetSubscriptionTier(GetSubscriptionTierRequest) returns (GetSubscriptionTierResponse);
    rpc GetTierMembers(GetTierMembersRequest) returns (GetTierMembersResponse);
    rpc UpdateName(UpdateNameRequest) returns (UpdateNameResponse);
    rpc BanUser(BanUserRequest) returns (BanUserResponse);
    rpc GetEarnings(GetEarningsRequest) returns (Earnings);
    rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
    rpc UpdateDisplayName(UpdateDisplayNameRequest) returns (UpdateDisplayNameResponse);
    rpc VerifyCreator(VerifyCreatorRequest) returns (VerifyCreatorResponse);
    rpc GetSubEarnings(GetSubEarningsRequest) returns (Earnings);
    rpc RetrieveSub(RetrieveSubRequest) returns (RetrieveSubResponse);
    
}

