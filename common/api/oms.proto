    rpc GetPost(GetPostRequest) returns (GetLatestPostsResponse);
    rpc GetLatestPosts(GetLatestPostsRequest) returns (GetLatestPostsResponse);
    rpc GetLatestUserPosts(GetLatestUserPostsRequest) returns (GetLatestUserPostsResponse);
    rpc GetUserLike(GetUserLikeRequest) returns (GetUserLikeResponse);
    rpc GetUserCommentLike(GetUserCommentLikeRequest) returns (GetUserCommentLikeResponse);
    rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
    rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
    rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse);
    rpc UnLikeComment(LikeCommentRequest) returns (LikeCommentResponse);
    rpc GetLatestComments(GetLatestCommentsRequest) returns (GetLatestCommentsResponse);
    rpc CreateReply(CreateReplyRequest) returns (CreateReplyResponse);
    rpc DeleteReply(DeleteReplyRequest) returns (DeleteReplyResponse);
    rpc GetLatestReplies(GetLatestRepliesRequest) returns (GetLatestRepliesResponse);
    rpc GetRecommended(GetRecommendedRequest) returns (GetRecommendedResponse);
    rpc SharePost(SharePostRequest) returns (SharePostResponse);
    
}

