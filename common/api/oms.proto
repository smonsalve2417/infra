message GetTransactionsRequest {
    string userId = 1; // UserID to fetch transactions
    int32 page = 2;
}

message Transaction {
    int64 id = 1;               // ID in JSON
    int32 gemAmount = 2;        // GemAmount in JSON
    string transactionType = 3; // TransactionType in JSON
    string type = 4;            // Type in JSON (outgoing/ingoing)
    PublicUser from = 5;        // From in JSON (the user involved in the transaction)
    bool pending = 6;           // Pending in JSON
    google.protobuf.Timestamp createdAt = 7; // CreatedAt in JSON
  }

  message TransactionsResponse {
    repeated Transaction transactions = 1; // Transactions in JSON
  }

  message SubscriptionTiers {
    string id = 1 ;
    string creator_id = 2 ;
    string name = 3 ;
    repeated string benefits = 4 ;
    int32 tier = 5 ;
    int32 price = 6 ;
    bool subscribed = 7;
  }

  message CreateSubscriptionTierResponse {
    string status = 1; 
  }

  message UpdateSubscriptionTierResponse {
    string status = 1; 
  }

  message GetSubscriptionTierRequest{
    string creator_id =1;
    string user_id=2;
}

message GetSubscriptionTierResponse {
