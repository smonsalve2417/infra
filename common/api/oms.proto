message Chat {
    
    string id = 1; 
    string creator_id = 2; 
    string user_id = 3; 
    google.protobuf.Timestamp createdAt = 4;
    bool request = 5;
    string lastMessage = 7;
    google.protobuf.Timestamp lastSentAt = 8;
  }

  message Message {
    string text = 1;
    string roomId = 2;
    string client_id = 3;
    int32 gems = 4;
    google.protobuf.Timestamp createdAt = 5;
    bool read = 6;
    repeated string contents= 7;
    string type =8;
    bool pending=9;
    int32 transaction_id=10;
  }

