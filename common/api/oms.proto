message Post {
    string id = 1; // ID is the unique identifier for the post.
    string title = 2; // Title is the title of the post.
    string description = 3; // Description is a brief summary of the post.
    string user_id = 4; // User_id is the ID of the user who created the post.
    repeated string content = 5; // Content is the main body of the post.
    repeated string tags = 6; // Tags are keywords associated with the post.
    int32 gems = 7; // Gems is the number of gems the post has received.
    int32 likes = 8; // Likes is the number of likes the post has received.
    int32 comments = 13;
    int32 shares = 9; // Shares is the number of times the post has been shared.
    int32 saves = 10; // Saves is the number of times the post has been saved.
    google.protobuf.Timestamp created_At = 11; // CreatedAt is the timestamp when the post was created.
    google.protobuf.Timestamp updated_At = 12; // UpdatedAt is the timestamp when the post was last updated.
    int32 tier = 14;
    int64 impression= 15;
  }

  message Comment{
    string id = 1; 
    string user_id = 2; 
    string post_id = 3; 
    string text = 4; 
    int32 gems=9;
    int32 likes = 5; 
    int32 replies = 6;
    google.protobuf.Timestamp created_At = 7; 
    google.protobuf.Timestamp updated_At = 8; 
  }

  message Reply{
    string id = 1; 
    string user_id = 2; 
    string comment_id = 3; 
    string text = 4; 
    int32 likes = 5; 
    int32 replies = 6;
    google.protobuf.Timestamp created_At = 7; 
    google.protobuf.Timestamp updated_At = 8; 
  }

  message GetRecommendedRequest {
    int32 page = 1;
    int32 pageSize = 2;
    string userID=4;
}


//GetLatestUserPosts
message GetRecommendedResponse  {
    repeated PostWithUser posts= 1;
}

